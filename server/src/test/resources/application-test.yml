spring:
  datasource:
    url: jdbc:h2:mem:workbridge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

logging:
  level:
    root: WARN
    com.workbridge.server: INFO

workbridge:
  security:
    jwt:
      secret: test-only-workbridge-jwt-secret-32-bytes-minimum
