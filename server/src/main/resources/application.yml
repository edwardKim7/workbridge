spring:
  application:
    name: workbridge-server
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:workbridge}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false"
    username: ${DB_USERNAME:workbridge}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: WorkBridgeHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  sql.init.mode: never
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
    problemdetails.enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  lifecycle.timeout-per-shutdown-phase: 20s
  jackson:
    time-zone: Asia/Seoul
    serialization.write-dates-as-timestamps: false
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    encoding: {charset: UTF-8, enabled: true, force: true}
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    whitelabel.enabled: false
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.workbridge.server.domain,com.workbridge.server.dto
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    jdbc-type-for-null: NULL
management:
  endpoints.web.exposure.include: health,info
  endpoint.health:
    show-details: never
    probes.enabled: true
  info.env.enabled: true
springdoc:
  swagger-ui: {path: /swagger-ui.html, operations-sorter: method, tags-sorter: alpha}
  api-docs.path: /v3/api-docs
  show-actuator: false
workbridge:
  name: WorkBridge
  version: 1.0.0
  security:
    login:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      lock-duration: ${LOGIN_LOCK_DURATION:15m}
    jwt:
      issuer: workbridge
      secret: ${JWT_SECRET:}
      access-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-ttl: ${JWT_REFRESH_TTL:14d}
  integration:
    erp:
      base-url: ${MOCK_ERP_BASE_URL:http://localhost:8081}
      connect-timeout: ${ERP_CONNECT_TIMEOUT:2s}
      read-timeout: ${ERP_READ_TIMEOUT:3s}
      max-attempts: ${ERP_MAX_ATTEMPTS:2}
      retry-backoff: ${ERP_RETRY_BACKOFF:250ms}
      payload-log-limit: ${ERP_PAYLOAD_LOG_LIMIT:8000}
  migration:
    max-file-size: 5MB
    chunk-size: 500
info:
  app:
    name: ${workbridge.name}
    version: ${workbridge.version}
    description: 사내 영업지원·전자결재 웹·모바일 통합 업무시스템
logging.level:
  root: INFO
  com.workbridge.server: INFO
  org.springframework.security: INFO
  org.mybatis: INFO
